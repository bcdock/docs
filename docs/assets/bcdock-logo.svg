<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="bcdock-favicon-title">
  <title id="bcdock-favicon-title">BCDock</title>
  <!--
    BC[)OCK logo - Space Grotesk SemiBold (wght=600) [ and ) glyphs,
    path-flattened from the OFL font, with a +0.02em boundary kerning so
    the [) pair reads as "two characters forming a D" rather than a unified D.

    Square 64x64 viewBox with the [) pair centred. Visible glyph bounds
    after the existing path transforms: x in [20.10, 44.69], y in [12.03, 51.99].
    That gives ~19% top/bottom safe area and ~30% left/right (structural,
    the glyph pair is portrait-shaped). The square shape matches how every
    consumer renders it today (`<img className="h-12 w-12">`, `width={48}
    height={48}`, mkdocs favicon, Next.js icon.svg convention) and the
    safe area prevents the glyph crowding the edges of browser tab
    favicons, "fast links" thumbnails, Apple touch icons, and Android
    maskable contexts.

    Path transforms are unchanged from the previous tight-crop variant -
    only the viewBox + width/height changed - so the [) kerning still
    matches shared/ui/src/components/Wordmark.tsx (margin-inline-start:
    0.04em on the cool span). Adjust both together if the [) gap changes.

    Three copies of this file are kept in sync:
      apps/portal/public/bcdock-logo.svg
      apps/website/public/bcdock-logo.svg
      docs-site/public/docs/assets/bcdock-logo.svg
    Plus two Next.js favicon-convention copies (same content):
      apps/portal/src/app/icon.svg
      apps/website/src/app/icon.svg
  -->
